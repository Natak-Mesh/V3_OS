<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Nucleus V3 — Voice</title>
  <link rel="stylesheet" href="cli.css">
  <style>
    /* Page-scoped extras for the soft-PTT handset. This is the one standalone
       page (not driven by cli.js): hold-to-talk / Spacebar-PTT can't be
       expressed in the shell's cursor/ENTER item model, and audio flows over
       /voice-ws to the voice daemon, not the REST API. It still wears the
       standard shell (cli.css tokens only — no bespoke palette). */
    .ptt-wrap { text-align: center; padding: 20px 14px 8px; }
    .ptt-btn {
      width: 200px; height: 200px; border-radius: 50%;
      border: 4px solid var(--border-color);
      background: var(--bg-card); color: var(--text-primary);
      font-family: inherit; font-size: 20px; font-weight: bold;
      cursor: pointer; user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent; touch-action: none;
      display: inline-flex; align-items: center; justify-content: center;
      text-align: center; line-height: 1.3; transition: transform .08s, background .08s;
    }
    .ptt-btn:disabled { opacity: .4; cursor: not-allowed; }
    .ptt-btn.talking { background: var(--off); border-color: var(--text-primary);
      color: var(--text-primary); transform: scale(.97); }
    .ptt-hint { color: var(--text-secondary); font-size: 12px; padding: 8px 14px 0; text-align: center; }

    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { padding: 4px 10px; border-radius: 12px; font-size: 13px; font-weight: bold;
      background: var(--ok); color: #05121f; }

    .warn-box { margin: 4px 14px; padding: 8px 12px; border-radius: 6px;
      border: 1px solid var(--warn); color: var(--text-primary); font-size: 13px; }

    /* Selectable-looking rows reused for transport + channel picks. These are
       directly tappable (no cursor), mirroring cli.css .row visuals. */
    .pick { display: flex; align-items: center; gap: 10px; padding: 12px 14px;
      min-height: 48px; cursor: pointer; border-bottom: 1px solid var(--border-color);
      font-family: inherit; font-size: 15px; width: 100%; text-align: left;
      background: transparent; color: var(--text-primary); }
    .pick .cur { width: 12px; flex: 0 0 12px; color: var(--accent); }
    .pick.active { background: var(--accent); color: #05121f; }
    .pick.active .cur { color: #05121f; }
    .pick:disabled { opacity: .4; cursor: not-allowed; }
    .pick .sub { color: var(--text-secondary); font-size: 12px; margin-left: auto; }
    .pick.active .sub { color: #05121f; }
  </style>
</head>
<body>
  <div id="shell">
    <!-- Persistent status header: node id · headset · voice-ws link state. -->
    <div id="hdr">
      <span class="title">VOICE</span>
      <span><span class="k">node</span> <span class="v" id="h-node">—</span></span>
      <span><span class="k">headset</span> <span class="v" id="h-hw">—</span></span>
      <span><span class="k">link</span> <span class="v" id="h-ws">…</span></span>
    </div>

    <!-- Only this scrolls; header and control bar are fixed. -->
    <div id="view">
      <div id="ptt-warn" class="warn-box" style="display:none"></div>
      <div id="banner" class="warn-box" style="display:none"></div>

      <div class="ptt-wrap">
        <button class="ptt-btn" id="ptt-btn" disabled>TALK</button>
      </div>
      <div class="ptt-hint">Press &amp; hold to talk · (or hold Spacebar)</div>

      <div class="page-title">Transport</div>
      <div id="tp-list"></div>

      <div class="page-title">Channel</div>
      <div id="chan-list"><div class="hint">Loading channels…</div></div>

      <div class="page-title">Receiving</div>
      <div class="content"><div class="tags" id="talkers">
        <span class="hint">No one talking</span></div></div>
    </div>

    <!-- Handset is standalone: the only control is BACK (to the TUI VOICE page). -->
    <div id="ctrl">
      <button id="c-back" title="Back (Esc)" style="grid-area: back;">BACK</button>
    </div>
  </div>

<script>
// ── Force onto HTTPS/443 before anything else ──────────────────────────────
// Voice needs a secure context (mic access) AND the /voice-ws WebSocket proxy,
// both of which live only on the nginx HTTPS vhost (port 443). If this page was
// opened over http, redirect to https://<same-host>/voice so it works whether
// reached by IP or .local.
(function () {
    if (location.protocol !== 'https:') {
        location.replace('https://' + location.hostname + '/voice');
    }
})();

// BACK: return to the dashboard we came from (the TUI VOICE page), or the shell
// root on the same host+scheme if there's no history.
function goBack(e) {
    if (e) e.preventDefault();
    if (window.history.length > 1) { window.history.back(); }
    else { location.href = location.protocol + '//' + location.host + '/'; }
}
document.getElementById('c-back').addEventListener('click', goBack);

// ── OpenVLM mesh voice — browser soft-PTT handset ──────────────────────────
// Audio: 16 kHz mono S16_LE, 20 ms frames (320 samples / 640 bytes) matching
// the daemon. Mic is captured at the device rate and downsampled to 16 kHz;
// received frames are upsampled back to the AudioContext rate for playback.

const FRAME_SAMPLES = 320;         // 20 ms @ 16 kHz
const FRAME_BYTES = FRAME_SAMPLES * 2;
const TARGET_RATE = 16000;
const JITTER_FRAMES = 4;           // ~80 ms browser playback jitter buffer

let ws = null;
let wsReady = false;
let talking = false;
let currentChannel = null;
let channels = [];
let transport = 'ip';              // 'ip' | 'stream' (mirrors daemon)
let streamInfo = { enabled: false, ready: false };

// Audio capture
let audioCtx = null;
let micStream = null;
let micNode = null;
let micSource = null;
let captureAccum = [];             // Float32 samples pending framing (at ctx rate)

// Audio playback
let playCtx = null;
let playQueue = [];                // Float32Array frames (at playback rate)
let playHead = 0;                  // next scheduled start time
let playing = false;

const bannerEl = document.getElementById('banner');
function banner(msg) {
    if (!msg) { bannerEl.style.display = 'none'; return; }
    bannerEl.textContent = msg;
    bannerEl.style.display = 'block';
}

// ── WebSocket ──────────────────────────────────────────────────────────────
function wsUrl() {
    const proto = (location.protocol === 'https:') ? 'wss:' : 'ws:';
    return proto + '//' + location.host + '/voice-ws';
}

function setLink(up) {
    const el = document.getElementById('h-ws');
    el.textContent = up ? 'up' : 'down';
    el.className = 'v ' + (up ? 'up' : 'down');
}

function connect() {
    ws = new WebSocket(wsUrl());
    ws.binaryType = 'arraybuffer';

    ws.onopen = () => {
        wsReady = true;
        setLink(true);
        document.getElementById('ptt-btn').disabled = false;
        ws.send(JSON.stringify({ type: 'hello' }));
    };

    ws.onclose = () => {
        wsReady = false;
        setLink(false);
        document.getElementById('ptt-btn').disabled = true;
        setTimeout(connect, 1500);
    };

    ws.onerror = () => { try { ws.close(); } catch (e) {} };

    ws.onmessage = (ev) => {
        if (typeof ev.data === 'string') {
            handleStatus(JSON.parse(ev.data));
        } else {
            handleAudio(ev.data);
        }
    };
}

function handleStatus(s) {
    if (!s || s.ok === false) return;
    if (s.node_id !== undefined) {
        document.getElementById('h-node').textContent = s.node_id;
    }
    if (s.hardware !== undefined) {
        const hw = document.getElementById('h-hw');
        hw.textContent = s.hardware ? 'attached' : 'phone only';
        hw.className = 'v ' + (s.hardware ? 'up' : '');
    }
    const pw = document.getElementById('ptt-warn');
    if (s.wrong_ptt) {
        pw.textContent = '\u26A0 Unsupported PTT device: ' + s.wrong_ptt +
            ' \u2014 this model cannot hold-to-talk. Plug in a supported PTT.';
        pw.style.display = 'block';
    } else {
        pw.style.display = 'none';
    }
    if (Array.isArray(s.channels)) {
        channels = s.channels;
        currentChannel = s.channel;
        renderChannels();
    } else if (s.channel !== undefined) {
        currentChannel = s.channel;
        markActiveChannel();
    }
    if (s.transport !== undefined) transport = s.transport;
    if (s.stream !== undefined) streamInfo = s.stream;
    renderTransport();
    renderTalkers(s.sources || []);
}

// ── Transport picker ────────────────────────────────────────────────────────
function renderTransport() {
    const list = document.getElementById('tp-list');
    const modes = [
        { id: 'ip', label: 'IP Mesh (streaming)', enabled: true, sub: '' },
        { id: 'stream', label: 'LoRa (streaming)',
          enabled: streamInfo.enabled && streamInfo.ready, sub: '' },
    ];
    list.innerHTML = '';
    modes.forEach(m => {
        const b = document.createElement('button');
        b.className = 'pick' + (transport === m.id ? ' active' : '');
        b.disabled = !m.enabled;
        b.innerHTML = '<span class="cur">' + (transport === m.id ? '&gt;' : '') +
            '</span><span>' + m.label + '</span>' +
            (m.sub ? '<span class="sub">' + m.sub + '</span>' : '');
        b.onclick = () => setTransport(m.id);
        list.appendChild(b);
    });
}

function setTransport(mode) {
    if (!wsReady || talking) return;
    if (mode === 'stream' && !(streamInfo.enabled && streamInfo.ready)) return;
    ws.send(JSON.stringify({ type: 'transport', mode: mode }));
    transport = mode;   // optimistic; status push will confirm
    renderTransport();
}

// ── Channel picker ──────────────────────────────────────────────────────────
function renderChannels() {
    const list = document.getElementById('chan-list');
    if (!channels.length) { list.innerHTML = '<div class="hint">No channels</div>'; return; }
    list.innerHTML = '';
    channels.forEach(ch => {
        const b = document.createElement('button');
        b.className = 'pick' + (ch.n === currentChannel ? ' active' : '');
        b.dataset.n = ch.n;
        b.innerHTML = '<span class="cur">' + (ch.n === currentChannel ? '&gt;' : '') +
            '</span><span>' + ch.n + ': ' + esc(ch.label) + '</span>';
        b.onclick = () => selectChannel(ch.n);
        list.appendChild(b);
    });
}

function markActiveChannel() {
    document.querySelectorAll('#chan-list .pick').forEach(b => {
        const on = parseInt(b.dataset.n, 10) === currentChannel;
        b.classList.toggle('active', on);
        b.querySelector('.cur').innerHTML = on ? '&gt;' : '';
    });
}

function selectChannel(n) {
    if (!wsReady) return;
    ws.send(JSON.stringify({ type: 'channel', n: n }));
    currentChannel = n;
    markActiveChannel();
}

function renderTalkers(sources) {
    const el = document.getElementById('talkers');
    if (!sources.length) { el.innerHTML = '<span class="hint">No one talking</span>'; return; }
    el.innerHTML = sources.map(id => {
        let label;
        if (id === 'lora') { label = 'LoRa voice'; }
        else if (typeof id === 'string' && id.indexOf('lora-') === 0) {
            // Suffix is the sender's short name when known, else a number.
            const who = id.slice(5);
            label = (/^\d+$/.test(who) ? 'Node ' + who : who) + ' (LoRa)';
        }
        else { label = 'Node ' + id; }
        return '<span class="tag">' + esc(label) + '</span>';
    }).join('');
}

function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ── Playback (mixed RX audio from the mesh) ─────────────────────────────────
function ensurePlayCtx() {
    if (!playCtx) {
        playCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (playCtx.state === 'suspended') playCtx.resume();
}

function handleAudio(arrbuf) {
    // Real-time only: if playback isn't running (autoplay policy / suspended),
    // drop the audio rather than queueing it — otherwise the backlog plays
    // later like a recording.
    if (!playCtx || playCtx.state !== 'running') return;
    const view = new DataView(arrbuf);
    const n = Math.floor(arrbuf.byteLength / 2);
    // Convert S16LE -> Float32 at 16 kHz, then resample to playback rate.
    const src = new Float32Array(n);
    for (let i = 0; i < n; i++) {
        src[i] = view.getInt16(i * 2, true) / 32768;
    }
    const ratio = playCtx.sampleRate / TARGET_RATE;
    const outLen = Math.round(n * ratio);
    const out = new Float32Array(outLen);
    for (let i = 0; i < outLen; i++) {
        const srcPos = i / ratio;
        const i0 = Math.floor(srcPos);
        const i1 = Math.min(i0 + 1, n - 1);
        const frac = srcPos - i0;
        out[i] = src[i0] * (1 - frac) + src[i1] * frac;
    }
    playQueue.push(out);
    // Bound backlog: keep at most 2x jitter buffer, drop oldest (stay live).
    while (playQueue.length > JITTER_FRAMES * 2) playQueue.shift();
    if (playQueue.length > JITTER_FRAMES && !playing) startPlayback();
    schedulePlayback();
}

function startPlayback() {
    playing = true;
    playHead = playCtx.currentTime + 0.02;
}

function schedulePlayback() {
    if (!playing) return;
    // If we've scheduled far ahead of real time (e.g. context was suspended),
    // resync instead of letting a backlog play out late.
    if (playHead > playCtx.currentTime + 0.5) {
        playHead = playCtx.currentTime + 0.02;
    }
    while (playQueue.length) {
        const frame = playQueue.shift();
        const buf = playCtx.createBuffer(1, frame.length, playCtx.sampleRate);
        buf.getChannelData(0).set(frame);
        const node = playCtx.createBufferSource();
        node.buffer = buf;
        node.connect(playCtx.destination);
        const now = playCtx.currentTime;
        if (playHead < now) playHead = now + 0.01;   // fell behind, resync
        node.start(playHead);
        playHead += frame.length / playCtx.sampleRate;
    }
}

// ── Capture (mic -> mesh while PTT held) ────────────────────────────────────
async function ensureMic() {
    if (micStream) return true;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        banner('Microphone unavailable. The voice page must be opened over ' +
               'HTTPS (https://…-nucleus.local) for the browser to allow mic access.');
        return false;
    }
    try {
        micStream = await navigator.mediaDevices.getUserMedia({
            audio: { channelCount: 1, echoCancellation: true,
                     noiseSuppression: true, autoGainControl: true },
            video: false
        });
    } catch (e) {
        banner('Microphone permission denied: ' + e.message);
        return false;
    }
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    micSource = audioCtx.createMediaStreamSource(micStream);
    // ScriptProcessor is deprecated but universally supported on mobile.
    micNode = audioCtx.createScriptProcessor(2048, 1, 1);
    micNode.onaudioprocess = onMicData;
    micSource.connect(micNode);
    micNode.connect(audioCtx.destination);   // required for the node to run
    banner('');
    return true;
}

function onMicData(ev) {
    if (!talking || !wsReady) return;
    const input = ev.inputBuffer.getChannelData(0);
    // Downsample from audioCtx.sampleRate to 16 kHz (linear interp) and frame.
    const ratio = audioCtx.sampleRate / TARGET_RATE;
    for (let i = 0; i < input.length; i++) captureAccum.push(input[i]);
    const needed = FRAME_SAMPLES * ratio;
    while (captureAccum.length >= needed) {
        const frame = new Int16Array(FRAME_SAMPLES);
        for (let j = 0; j < FRAME_SAMPLES; j++) {
            const pos = j * ratio;
            const i0 = Math.floor(pos);
            const i1 = Math.min(i0 + 1, captureAccum.length - 1);
            const frac = pos - i0;
            let s = captureAccum[i0] * (1 - frac) + captureAccum[i1] * frac;
            s = Math.max(-1, Math.min(1, s));
            frame[j] = s < 0 ? s * 32768 : s * 32767;
        }
        captureAccum.splice(0, Math.round(needed));
        if (ws && wsReady) ws.send(frame.buffer);
    }
}

// ── PTT control ─────────────────────────────────────────────────────────────
// pttHeld tracks the PHYSICAL button state. pttDown() awaits mic setup, and
// on first use the button can be released (touchend) before that await
// resolves — without this check, talking would then latch on.
let pttHeld = false;

async function pttDown() {
    pttHeld = true;
    if (talking || !wsReady) return;
    ensurePlayCtx();
    const ok = await ensureMic();
    if (!ok || !pttHeld || talking) return;  // released during setup: don't latch
    talking = true;
    captureAccum = [];
    document.getElementById('ptt-btn').classList.add('talking');
    ws.send(JSON.stringify({ type: 'ptt', down: true }));
}

function pttUp() {
    pttHeld = false;
    if (!talking) return;
    talking = false;
    document.getElementById('ptt-btn').classList.remove('talking');
    if (ws && wsReady) ws.send(JSON.stringify({ type: 'ptt', down: false }));
    document.getElementById('ptt-btn').textContent = 'TALK';
}

const pttBtn = document.getElementById('ptt-btn');
pttBtn.addEventListener('mousedown', (e) => { e.preventDefault(); pttDown(); });
pttBtn.addEventListener('mouseup', (e) => { e.preventDefault(); pttUp(); });
pttBtn.addEventListener('mouseleave', () => pttUp());
pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); pttDown(); }, { passive: false });
pttBtn.addEventListener('touchend', (e) => { e.preventDefault(); pttUp(); }, { passive: false });
pttBtn.addEventListener('touchcancel', (e) => { e.preventDefault(); pttUp(); }, { passive: false });

document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !e.repeat) { e.preventDefault(); pttDown(); }
});
document.addEventListener('keyup', (e) => {
    if (e.code === 'Space') { e.preventDefault(); pttUp(); }
});

// Arm/resume playback on user interaction (mobile autoplay policy). Not
// {once:true}: the context can re-suspend (tab switch), so resume every time.
document.body.addEventListener('click', ensurePlayCtx);
document.body.addEventListener('touchstart', ensurePlayCtx, { passive: true });

connect();
</script>
</body>
</html>
