<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Nucleus V3</title>
  <!-- Apply the saved display theme before the stylesheet paints, so there is no
       flash of the default palette. Theme is chosen in NODE SETTINGS and stored
       per-browser; "classic" is the implicit default (no data-theme attr). -->
  <script>
    try {
      var t = localStorage.getItem("nucleus-theme");
      if (t && t !== "classic") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="cli.css">
</head>
<body>
  <div id="shell">
    <!-- Persistent status header: node id · mesh IP · mesh state · version -->
    <div id="hdr">
      <span><span class="k">node</span> <span class="v" id="h-node">—</span></span>
      <span><span class="k">ip</span> <span class="v" id="h-ip">—</span></span>
      <span><span class="k">mesh</span> <span class="v" id="h-mesh">—</span></span>
    </div>

    <!-- Only this scrolls; header, compose dock and control bar are fixed. -->
    <div id="view"></div>

    <!-- Pinned compose dock: pages with a `compose` item render it here so the
         input stays put and is never pushed around by the growing log. -->
    <div id="compose-dock"></div>

    <!-- Fixed control set, identical on every page. -->
    <div id="ctrl">
      <button id="c-up" title="Up (↑)">&#9650;</button>
      <button id="c-enter" title="Enter (Enter)">ENTER</button>
      <button id="c-down" title="Down (↓)">&#9660;</button>
      <button id="c-back" title="Back (Esc)">BACK</button>
    </div>
  </div>
  <script src="app.js"></script>
  <script src="cli.js"></script>
</body>
</html>
