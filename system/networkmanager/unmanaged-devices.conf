# Keep NetworkManager off the mesh/AP/bridge/eth0 interfaces — nucleus-mesh and
# systemd-networkd own them. eth0 is included so systemd-networkd is its sole
# manager: otherwise NetworkManager and networkd both drive eth0, which on a
# router-less fiber link leaves eth0 cycling its IPv6 link-local (NM retries
# DHCP, times out, clears the address) and breaks Reticulum AutoInterface.
[keyfile]
unmanaged-devices=interface-name:wlan1;interface-name:wlan0;interface-name:br-lan;interface-name:halow0;interface-name:eth0
