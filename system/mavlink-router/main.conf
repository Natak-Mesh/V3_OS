# mavlink-router — bridges the flight controller (GPIO UART) to the mesh.
# The GCS connects to <this node's mesh IP>:14550 over UDP.
# Installed to /etc/mavlink-router/main.conf by install.sh.

[General]
# Disable the default TCP server (5760); UDP 14550 is the only listener.
TcpServerPort=0

[UartEndpoint fc]
Device=/dev/serial0
Baud=921600

[UdpEndpoint gcs]
Mode=Server
Address=0.0.0.0
Port=14550
# GPS_INPUT (232) is for the FC only; don't spend mesh bandwidth on it.
BlockMsgIdOut=232

# Local GPS bridge (nucleus-gps.service) sends GPS_INPUT here -> FC.
[UdpEndpoint gps]
Mode=Server
Address=127.0.0.1
Port=14560
