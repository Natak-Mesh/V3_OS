# ============================================================
# Nucleus V3 OS — node configuration (single source of truth)
#
# Edit this file, then apply with:   sudo nucleusctl apply
# or via the web UI / REST API (PUT /api/v1/config).
#
# You set primitives; the system DERIVES everything else from node.id:
#   mesh IP        = <mesh.subnet_prefix>.<node.id>
#   br-lan IP      = <br_lan.subnet_prefix>.1
#   AP SSID        = <node.id:04d>-nucleus-ap
#   hostname       = <node.id:04d>-nucleus
#   IPv6 link-locals = derived deterministically from the hostname
# ============================================================

node:
  # id is parsed from the hostname (e.g. 0042-nucleus -> 42), set when the SD
  # card is flashed. Uncomment to override.
  # id: 42
  # name:            # optional hostname override; default = system hostname

mesh:
  ssid: natak_mesh
  channel: 3         # 2.4 GHz
  password: "52235223"
  subnet_prefix: "10.20.1"
  country: US
  # --- tuning (ported from Nucleus_OS; leave defaults unless you know why) ---
  mcast_ttl: 8       # IP TTL forced on br-lan multicast ingress
  mesh_802_ttl: 8    # 802.11s L2 mesh_ttl / mesh_element_ttl
  rts_threshold: 500 # RTS/CTS bytes (0=off; 500 recommended for 3+ nodes)

br_lan:
  # subnet_prefix defaults to 10.20.<node.id> (per-node LAN). Uncomment to override.
  # subnet_prefix: "10.20.42"
  dhcp_pool_offset: 10
  dhcp_pool_size: 50
  dns: "8.8.8.8"

ap:
  channel: 36        # 5 GHz
  password: "52235223"
  # name:            # optional SSID override; default '<id:04d>-nucleus-ap'

eth0:
  mode: wan          # wan = DHCP client / internet gateway; lan = serve DHCP
  dhcp_pool_offset: 10
  dhcp_pool_size: 100

meshtastic:
  enabled: true            # run meshtasticd (native) + expose radio to the bridge
  region: US               # LoRa region; radio won't TX until set
  hat: rak6421-slot1       # LoRa HAT/slot: rak6421-slot1 | rak6421-slot2 | auto
  gps: uart                # GPS wiring: off | uart | i2c  (hardware-verified: uart)
  gps_serial_path: /dev/ttyS0   # UART GPS device (Pi GPIO header = ttyS0)
  i2c_device: /dev/i2c-1        # only used when gps: i2c
  cot_bridge: true         # run the ATAK CoT <-> LoRa bridge (cot-bridge.service)

messaging:
  enabled: true            # run the text messaging service (nucleus-messaging.service)
  wifi_group: 239.10.10.60 # UDP multicast group for the WiFi transport (wlan1 mesh)
  wifi_port: 17020         # UDP port for the WiFi transport
  lora: true               # also send/receive over Meshtastic LoRa (standard text)
  dedupe_window_secs: 60   # window to match the LoRa + WiFi copies of one message
  history_limit: 500       # max messages retained / returned to the UI

reticulum:
  enabled: true            # run the Reticulum daemon (rnsd.service)
  transport: true          # act as a transport node (route/relay for peers)
  loglevel: 4              # rnsd verbosity 0=critical .. 7=extreme
  auto_interface: true     # AutoInterface peering on the wlan1 802.11s mesh
  auto_device: wlan1
  tcp_server: true         # TCPServerInterface on br-lan for wired/AP clients
  tcp_server_port: 4242
  entry_node: true         # uplink to a public-IP Reticulum entry node
  entry_node_host: 173.230.150.24
  entry_node_port: 4243
  kiss_enabled: false      # optional KISS packet-radio TNC on a serial device
  # kiss_port: /dev/rfcomm0
  # kiss_speed: 115200

tak:
  # Official TAK Server (+ MediaMTX) — OFF on most nodes. Set variant: official,
  # drop the tak.gov .deb in ~natak, then run:  sudo nucleus-tak-setup.sh
  # This block is consumed by that one-shot script, NOT by 'nucleusctl apply'.
  variant: none            # none | official
  enrollment_validity_days: 365   # validity of certs issued via auto-enrollment
  keystore_pass: atakatak  # signing keystore password (TAK default)
  cert:                    # X.509 metadata baked into the PKI
    country: US
    state: FL
    city: Tampa
    organization: NATAK
    organizational_unit: TAK

voice:
  enabled: true            # run the mesh PTT voice daemon (nucleus-voice.service)
  channel: 1               # startup voice channel (multicast group 239.10.10.N)
  channels: "1:Command"    # named channel list "N:Label,N:Label"
  jitter_ms: 80            # per-source RX jitter buffer before playback (ms)
  tx_gain: 4.0             # software mic gain for the OpenVLM (hardware) path
  # --- LoRa voice-text (Vosk STT -> Meshtastic text -> Piper TTS); needs models ---
  lora_enabled: false      # enable LoRa voice-text
  lora_max_secs: 30.0      # max speech captured per utterance (s)
  lora_portnum: 260        # Meshtastic app portnum for LoRa voice-text
  lora_hop_limit: 0        # 0 = direct RF neighbors only (no rebroadcast)
  stt_engine: vosk         # vosk (fielded default) | sherpa (opt-in)
  # stt_model:             # optional model override (dir name or abs path)
  # stt_grammar:           # optional phrase-list file (vosk only)
  stt_cleanup: true        # HPF + WebRTC noise-suppression on the STT mic tap
  # --- live Codec2 voice stream over LoRa (advanced) ---
  stream_enabled: false
  stream_portnum: 256
