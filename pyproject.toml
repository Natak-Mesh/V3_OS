[project]
name = "nucleusd"
dynamic = ["version"]
description = "Nucleus V3 OS — node config CLI (nucleusctl) and mesh bring-up"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nucleusctl = "nucleusd.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nucleusd"]

[tool.setuptools.dynamic]
version = { file = ["VERSION"] }

[tool.setuptools.package-data]
nucleusd = ["templates/**/*.j2"]

[tool.pytest.ini_options]
pythonpath = ["."]
